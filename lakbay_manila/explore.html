<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakbay Manila | Explore</title>
    <link rel="stylesheet" href="explore.css">
    <script src="explore.js" defer></script>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <nav class="navbar">
            <a href="home.html" class="logo">LM</a>

            <ul class="nav-links">
                <li><a href="home.html">HOME</a></li>
                <li>
                    <a href="https://www.google.com/maps/search/?api=1&query=Tourist+Attractions+in+Manila"
                       target="_blank"
                       rel="noopener noreferrer">MAPS</a>
                </li>
                <li><a href="explore.html" class="active">EXPLORE</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- PAGE TITLE -->
        <section class="title-container">
            <span class="line"></span>
            <h1>Tuklasin ang mga lugar sa Maynila</h1>
            <span class="line"></span>
        </section>

        <!-- SEARCH -->
        <section class="search-container">
            <div class="input-box">
                <label for="placeSearch">Search Places</label>
                <input
                    type="text"
                    id="placeSearch"
                    placeholder="What are you looking for?"
                >
            </div>
        </section>

        <!-- CATEGORY FILTERS -->
        <section class="filters">
            <button class="filter-btn active" data-filter="all">All (36)</button>
            <button class="filter-btn" data-filter="historical">Historical (9)</button>
            <button class="filter-btn" data-filter="museum">Museum (9)</button>
            <button class="filter-btn" data-filter="church">Churches (7)</button>
            <button class="filter-btn" data-filter="park">Parks (6)</button>
            <button class="filter-btn" data-filter="food">Food (5)</button>
        </section>

        <!-- PLACE CARDS ARE GENERATED BY explore.js -->
        <section class="places-grid" id="placesGrid"></section>

        <!-- NO RESULTS MESSAGE -->
        <p id="noResults" class="no-results" hidden>
            No places found. Try another search.
        </p>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <h2>Lakbay Manila</h2>
        <p>Discover the stories behind the historic city of Manila.</p>
        <small>&copy; 2026 Lakbay Manila. All rights reserved.</small>
    </footer>

</body>
</html>
